<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AB Club card module local visual reference</title>
  <style>
    :root {
      color-scheme: light;
      --green: #173c32;
      --green-soft: #e4ede8;
      --ivory: #f6f1e7;
      --paper: #fcfbf7;
      --ink: #1c2723;
      --muted: #66716c;
      --border: #d9d2c5;
      --gold: #a67c3d;
      --error: #a55a4d;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #dcd8d0;
      color: var(--ink);
      font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    #stage { min-height: 100vh; }
    .phone {
      position: relative;
      width: 430px;
      min-height: 932px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--ivory);
    }
    .watermark {
      position: sticky;
      z-index: 5;
      top: 0;
      display: block;
      width: 100%;
      padding: 8px 12px;
      border-bottom: 1px solid #b98379;
      background: #f6e7e2;
      color: #713b32;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-align: center;
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      border-bottom: 1px solid var(--border);
      background: var(--ivory);
      color: var(--ink);
      font-size: 16px;
      font-weight: 650;
    }
    .page { padding: 24px 18px 38px; }
    .page.center { min-height: 820px; display: flex; flex-direction: column; justify-content: center; }
    .kicker {
      margin: 0 0 7px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: var(--green);
      font-size: 30px;
      line-height: 1.22;
      overflow-wrap: anywhere;
    }
    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }
    .runtime {
      display: inline-flex;
      margin-top: 14px;
      padding: 6px 11px;
      border: 1px solid var(--border);
      border-radius: 99px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .panel {
      margin-top: 18px;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--paper);
    }
    .panel.accent { border-left: 4px solid var(--gold); }
    .panel.error { border-color: var(--error); }
    .panel h2 { margin: 0; color: var(--green); font-size: 17px; line-height: 1.4; }
    .panel p { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .status {
      margin-top: 15px;
      padding: 12px 13px;
      border-left: 3px solid var(--gold);
      background: #f1eadc;
      color: #5d513e;
      font-size: 12px;
      line-height: 1.55;
    }
    .status.success { border-color: var(--green); background: var(--green-soft); color: var(--green); }
    .status.error { border-color: var(--error); background: #f6e7e2; color: #713b32; }
    .stack { display: grid; gap: 10px; margin-top: 16px; }
    .button {
      min-height: 46px;
      padding: 12px 15px;
      border: 1px solid var(--green);
      border-radius: 10px;
      background: var(--green);
      color: #fff;
      font-size: 14px;
      font-weight: 750;
      text-align: center;
    }
    .button.secondary { background: transparent; color: var(--green); }
    .button.disabled { border-color: var(--border); background: #e8e4db; color: #7f8883; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .avatar {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: #ece7dc;
      color: var(--green);
      font-size: 22px;
      font-weight: 800;
    }
    .identity { min-width: 0; flex: 1; }
    .name { color: var(--green); font-size: 21px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
    .city { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .bio { margin-top: 15px; color: var(--ink); font-size: 14px; line-height: 1.65; }
    .claim-empty { margin-top: 14px; color: var(--muted); font-size: 12px; }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 15px; }
    .field {
      min-width: 0;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--ivory);
    }
    .field b { display: block; color: var(--muted); font-size: 10px; }
    .field span { display: block; margin-top: 3px; color: var(--ink); font-size: 12px; overflow-wrap: anywhere; }
    .view-pill { padding: 5px 9px; border: 1px solid var(--gold); border-radius: 99px; color: var(--gold); font-size: 10px; font-weight: 800; }
    .link {
      display: flex;
      justify-content: space-between;
      min-height: 48px;
      padding: 15px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .link:last-child { border-bottom: 0; }
    .arrow { color: var(--gold); font-size: 18px; }
    .meaning { margin-top: 11px; padding: 12px; border: 1px solid var(--border); border-radius: 9px; }
    .meaning code { color: var(--green); font-weight: 850; }
    .meaning div { margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .privacy-row { margin-top: 12px; padding: 13px; border: 1px solid var(--border); border-radius: 10px; background: var(--paper); }
    .privacy-row .row { font-size: 13px; font-weight: 750; }
    .privacy-row small { display: block; margin-top: 7px; color: var(--muted); line-height: 1.45; }
    .visibility { padding: 4px 7px; border-radius: 5px; background: #efede7; color: #78817d; font-size: 10px; }
    .state-icon {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      margin-bottom: 15px;
      border: 2px solid currentColor;
      border-radius: 50%;
      font-size: 24px;
      font-weight: 800;
    }
    .state.success { color: var(--green); }
    .state.error { color: var(--error); }
    .state h2 { color: currentColor; }
    .privacy-note { margin-top: 12px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .contact {
      display: grid;
      grid-template-columns: repeat(3, 430px);
      gap: 20px;
      align-items: start;
      width: max-content;
      padding: 20px;
    }
    .contact .phone { min-height: 932px; box-shadow: 0 1px 4px rgba(28,39,35,.12); }
  </style>
</head>
<body>
  <main id="stage" aria-live="polite"></main>
  <script>
    const watermark = '<div class="watermark">LOCAL UI REFERENCE · SYNTHETIC DATA · NOT WECHAT DEVTOOLS</div>';
    const shell = (title, body, extra = '') => `<section class="phone" data-evidence-view="${title}">${watermark}<div class="nav">AB Club</div><div class="page ${extra}">${body}</div></section>`;
    const header = (kicker, title, subtitle) => `<div class="kicker">${kicker}</div><h1>${title}</h1><p class="subtitle">${subtitle}</p>`;
    const card = (mode, fields) => `<div class="panel accent">
      <div class="row"><div class="avatar">AB</div><div class="identity"><div class="name">林安然（本地合成长姓名布局验证）</div><div class="city">深圳 · Shenzhen</div></div><span class="view-pill">${mode}</span></div>
      <div class="bio">连接可靠的人，也尊重每一项资料的边界。这是一段本地合成、可换行的一句话介绍。</div>
      <div class="claim-empty">认证标签：无有效人工审核结果</div>
      ${fields ? `<div class="field-grid">${fields}</div>` : ''}
    </div>`;
    const views = {
      bootstrap: shell('bootstrap', `${header('AB Club · Identity', '从一张可信、克制的名片开始', '微信身份只由云函数上下文确认。手机号、证件、审核材料和微信标识不会进入公开名片。')}<span class="runtime">运行模式 · LOCAL VISUAL ONLY</span><div class="panel accent"><h2>开始前，你需要知道</h2><p>初始化只建立账户会话，不代表获得任何认证。公开徽章仅来自仍然有效的人工审核结果。</p></div><div class="stack"><div class="button">初始化微信身份</div><div class="button secondary">先浏览公开内容</div></div>`, 'center'),
      me: shell('me', `${header('Account', '我的', '管理完整资料、字段隐私与分享入口。私密资料不会进入公开名片。')}<div class="panel accent"><div class="row"><div><div style="font-size:11px;color:var(--muted)">当前昵称</div><div style="margin-top:3px;font-weight:750">林安然（合成）</div></div><span class="runtime" style="margin:0">资料完整度 75%</span></div></div><div class="panel"><h2>资料与名片</h2><div class="link">编辑个人资料 <span class="arrow">›</span></div><div class="link">逐字段隐私 <span class="arrow">›</span></div><div class="link">安全分享与撤销 <span class="arrow">›</span></div><div class="link">查看我的公开名片 <span class="arrow">›</span></div></div><div class="status">运行模式：LOCAL VISUAL ONLY。本图不含真实用户资料。</div>`),
      'card-self': shell('card-self', `${header('My Card', '我的数字名片', '服务端生成的公开投影；不直接读取完整私密资料。')}${card('本人', '<div class="field"><b>行业</b><span>科技与社区</span></div><div class="field"><b>兴趣</b><span>徒步、城市文化</span></div>')}<div class="status">待审核与驳回提示仅本人视角可见（此图不伪造审核结果）。</div><div class="stack"><div class="button secondary">编辑资料</div><div class="button secondary">隐私设置</div></div>`),
      'card-stranger': shell('card-stranger', `${header('Profile', '数字名片', '查看关系由服务端判定；客户端不接收好友或认证参数。')}${card('陌生人', '<div class="field"><b>行业</b><span>科技与社区</span></div><div class="field"><b>好友字段</b><span>已由服务端隐藏</span></div>')}<div class="status">当前视角：陌生人。刷新会重新核验分享、拉黑、关系与认证有效性。</div>`),
      'card-friend': shell('card-friend', `${header('Profile', '数字名片', '只有 ACCEPTED 且未拉黑的关系才能看到 FRIENDS_ONLY 字段。')}${card('已接受好友', '<div class="field"><b>行业</b><span>科技与社区</span></div><div class="field"><b>职位 · 好友可见</b><span>产品负责人</span></div><div class="field"><b>公司 · 好友可见</b><span>AB Community Lab</span></div><div class="field"><b>兴趣</b><span>徒步、城市文化</span></div>')}<div class="status success">当前视角：已接受好友。删除好友后，页面刷新必须立即收回好友字段。</div>`),
      privacy: shell('privacy', `${header('Field Privacy', '逐字段隐私', '可见性由服务端在每次查看时执行。删除好友后，FRIENDS_ONLY 字段会在刷新时立即收回。')}<div class="panel accent"><h2>三个级别的真实含义</h2><div class="meaning"><code>PUBLIC</code><div>任何通过有效入口的查看者都可能看到，仍受撤销、过期、拉黑和服务端投影约束。</div></div><div class="meaning"><code>FRIENDS_ONLY</code><div>仅 ACCEPTED 且未拉黑的好友可见；删除好友后刷新立即收回。</div></div><div class="meaning"><code>PRIVATE</code><div>只在本人受控资料域可见，不能进入公开 API、分享 query、日志或海报。</div></div></div><div class="privacy-row"><div class="row">行业 <span class="visibility">未读取 · 锁定</span></div><small>冻结 DTO 尚不包含字段级 Visibility，客户端不会猜测当前设置。</small></div><div class="privacy-row"><div class="row">手机号与证件 <span class="visibility">PRIVATE</span></div><small>永久私密；不存在公开或好友可见选项。</small></div>`),
      'share-success': shell('share-success', `${header('Secure Share', '分享与撤销', '数据库只保存 token hash；原始 token 仅在当前页面内存中使用。')}<div class="panel state success"><div class="state-icon">✓</div><h2>安全入口已创建</h2><p>这是本地合成状态覆盖。真实页面只有收到服务端成功响应后才会进入此状态；打开转发面板不等于转发成功。</p></div><div class="stack"><div class="button">微信转发名片</div><div class="button secondary">生成小程序码</div><div class="button secondary">撤销当前入口</div></div><div class="status">scene 只允许短令牌，不携带身份、完整资料 ID 或权限参数。</div>`),
      'share-expired': shell('share-expired', `${header('Shared Card', '分享入口', '每次访问都由服务端重新检查有效期、撤销、拉黑、好友关系和认证有效性。')}<div class="panel state error"><div class="state-icon">!</div><h2>入口已过期</h2><p>此分享超过服务端有效期，无法继续查看。请联系名片主人创建新的安全入口。</p></div><div class="stack"><div class="button secondary">返回首页</div></div><div class="status error">不会从过期响应恢复或缓存旧的公开字段与认证标签。</div>`),
      'share-revoked': shell('share-revoked', `${header('Shared Card', '分享入口', '服务端在历史入口打开与页面刷新时重新核验撤销状态。')}<div class="panel state error"><div class="state-icon">×</div><h2>入口已撤销</h2><p>名片主人已撤销这个入口。页面不会展示撤销前缓存的好友字段或认证标签。</p></div><div class="stack"><div class="button secondary">返回首页</div></div><div class="status error">重复撤销由服务端幂等处理；客户端不伪造成功。</div>`),
    };
    const params = new URLSearchParams(location.search);
    const selected = params.get('view') || 'bootstrap';
    document.getElementById('stage').innerHTML = selected === 'contact'
      ? `<div class="contact">${Object.values(views).join('')}</div>`
      : (views[selected] || views.bootstrap);
    document.documentElement.dataset.ready = 'true';
  </script>
</body>
</html>
